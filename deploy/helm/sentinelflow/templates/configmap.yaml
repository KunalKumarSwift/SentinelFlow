apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinelflow.fullname" . }}
  labels:
    {{- include "sentinelflow.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  RUN_WORKER_IN_API: "false"
  API_HOST: "0.0.0.0"
  API_PORT: {{ .Values.api.port | quote }}
  METRICS_PORT: {{ .Values.worker.metricsPort | quote }}
