apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinelflow.fullname" . }}-api
  labels:
    {{- include "sentinelflow.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sentinelflow.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
