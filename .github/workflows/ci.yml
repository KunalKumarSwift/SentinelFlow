name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Layer rules
        run: uv run lint-imports
      - name: File size
        run: uv run python scripts/check_file_size.py --max 120
      - name: Tests
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing
