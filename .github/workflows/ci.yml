name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Runs every contract test against Postgres/Redis as well as the memory versions.
      TEST_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinelflow
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Layer rules
        run: uv run lint-imports
      - name: File size
        run: uv run python scripts/check_file_size.py --max 120
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.70.0
      - name: Rego unit tests
        run: opa test deploy/opa -v
      - name: Start OPA with the SentinelFlow policy
        run: |
          opa run --server --addr 127.0.0.1:8181 deploy/opa &
          for _ in $(seq 1 30); do curl -sf 127.0.0.1:8181/health && break; sleep 1; done
      - name: Tests
        env:
          TEST_OPA_URL: http://127.0.0.1:8181
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing
