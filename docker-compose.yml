# Scaled-out SentinelFlow: one API, N workers, PostgreSQL and Redis.
#
#   docker compose up --build --scale worker=3
#   uv run python scripts/smoke_test.py --api http://127.0.0.1:8000
#
# `--profile llm` also starts Ollama (set LLM_BACKEND=ollama to use it);
# `--profile observability` adds Prometheus (:9090), Grafana (:3000, dashboard provisioned)
# and Jaeger (:16686); run it with OTLP_ENDPOINT=http://jaeger:4318 to send traces.

x-app: &app
  build: .
  environment: &env
    APP_ENV: dev
    JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-chars-min}
    STORAGE_BACKEND: postgres
    DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelflow
    QUEUE_BACKEND: redis
    REDIS_URL: redis://redis:6379/0
    LLM_BACKEND: ${LLM_BACKEND:-none}
    OLLAMA_URL: http://ollama:11434
    OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  api:
    <<: *app
    environment:
      <<: *env
      RUN_WORKER_IN_API: "false"
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["sentinelflow-worker"]
    deploy: { replicas: 2 }
    # SIGTERM lets a worker finish its batch; unfinished commands reappear after 60 s.
    stop_grace_period: 30s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    profiles: [observability]
    ports: ["16686:16686"]

  ollama:
    image: ollama/ollama:0.5.4
    profiles: [llm]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  ollama:
