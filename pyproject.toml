[project]
name = "sentinelflow"
version = "0.1.0"
description = "Agentic security-incident orchestration with LangGraph, built secure-by-design."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-sdk>=1.28",
    "prometheus-client>=0.21",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
    "structlog>=24.4",
    "uvicorn>=0.32",
]

[project.scripts]
sentinelflow-api = "sentinelflow.bootstrap.serve:main"
sentinelflow-worker = "sentinelflow.bootstrap.worker_main:main"
sentinelflow-sim = "sentinelflow.simulator.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
    "locust>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["e2e: end-to-end tests that need the Docker Compose stack"]

[tool.coverage.run]
source = ["src/sentinelflow"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Code blocks in docs are illustrative signatures, not source.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "D", "DTZ"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# S311: seeded, reproducible randomness is the point of the simulator, not security.
"tests/**" = ["S101", "D", "S311"]
"src/sentinelflow/simulator/**" = ["S311"]
"scripts/load/**" = ["S311"]
"scripts/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
